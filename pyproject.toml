[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warranty-local"
version = "0.1.0"
description = "Local warranty information and simulated D/W settlement"
requires-python = ">=3.10"
dependencies = [
  "langchain==1.3.14",
  "langgraph==1.2.10",
  "langsmith==0.10.17",
  "langchain-core==1.6.0",
  "langchain-openai==1.4.3",
  "langchain-community==0.4.2",
  "langchain-chroma==1.1.0",
  "langchain-text-splitters==1.1.2",
  "chromadb==1.5.9",
  "openai==2.54.0",
  "streamlit==1.62.0",
  "requests==2.34.2",
  "python-dotenv==1.2.3",
  "typing-extensions==4.16.0",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "PyMuPDF==1.28.2",
]

[project.scripts]
warranty = "warranty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warranty = ["migrations/*.sql"]
